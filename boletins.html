<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletins</title>
    <link rel="stylesheet" href="styles.css"> <!-- Incluindo o CSS comum -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        /* Estilos específicos para o boletins.html */
        .module {
            max-width: 600px; /* Limitar a largura do módulo */
            margin: 20px auto; /* Centralizar o módulo na página */
            padding: 20px;
            background: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            text-align: center; /* Centralizar títulos */
        }

        button {
            width: 100%; /* Botão ocupa toda a largura */
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px; /* Margem superior para o botão */
        }

        button:hover {
            background-color: #218838; /* Efeito hover no botão */
        }

        #resultado {
            margin-top: 20px; /* Margem superior para o resultado */
            text-align: left; /* Alinhar texto à esquerda */
        }
    </style>
</head>
<body>

<h1>Boletins de Plantonistas e Atendimentos</h1>
<div class="module">
    <h2>Selecionar Tipo de Boletim</h2>
    <select id="tipoBoletim" onchange="atualizarBoletim()">
        <option value="12h">Boletim de 12h</option>
        <option value="24h">Boletim de 24h</option>
    </select>

    <h2>Ver Dados</h2>
    <button onclick="verBoletimPlantonistas()">Boletim de Plantonistas</button>
    <button onclick="verBoletimAtendimentos()">Boletim de Atendimentos do Dia</button>
    <button onclick="verBoletimIntercorrencias()">Boletim de Intercorrências</button>

    <h2>Exportar Dados</h2>
    <button onclick="exportarParaPDF()">Exportar como PDF</button>
    <button onclick="exportarParaTXT()">Exportar como TXT</button>
    <button onclick="exportarParaCSV()">Exportar como CSV</button>
    <button onclick="exportarParaExcel()">Exportar como Excel</button>
</div>

<div id="resultado"></div>

<script>
    // Simulação de dados (substitua pelos seus dados reais)
    const listaPlantonistas = {
        "12h": [
            { nome: "João Silva", turno: "12h", dia: "2025-12-20" },
            { nome: "Maria Oliveira", turno: "12h", dia: "2025-12-20" }
        ],
        "24h": [
            { nome: "Carlos Santos", turno: "24h", dia: "2025-12-20" },
            { nome: "Ana Lima", turno: "24h", dia: "2025-12-20" }
        ]
    };

    const listaAtendimentos = [
        { data: "2025-12-20", paciente: "Carlos Souza", queixa: "Dor abdominal" },
        { data: "2025-12-20", paciente: "Ana Lima", queixa: "Tontura" }
    ];

    const listaIntercorrencias = [
        { data: "2025-12-20", paciente: "Pedro Santos", descricao: "Hipertensão" }
    ];

    function atualizarBoletim() {
        const tipo = document.getElementById('tipoBoletim').value;
        verBoletimPlantonistas(tipo);
    }

    function verBoletimPlantonistas(tipo) {
        const resultadoDiv = document.getElementById('resultado');
        resultadoDiv.innerHTML = '<h3>Boletim de Plantonistas (' + tipo + ')</h3>' + 
            listaPlantonistas[tipo].map(p => `<p>${p.nome} - Turno: ${p.turno} - Dia: ${p.dia}</p>`).join('');
    }

    function verBoletimAtendimentos() {
        const resultadoDiv = document.getElementById('resultado');
        resultadoDiv.innerHTML = '<h3>Boletim de Atendimentos do Dia</h3>' + 
            listaAtendimentos.map(a => `<p>Data: ${a.data}, Paciente: ${a.paciente}, Queixa: ${a.queixa}</p>`).join('');
    }

    function verBoletimIntercorrencias() {
        const resultadoDiv = document.getElementById('resultado');
        resultadoDiv.innerHTML = '<h3>Boletim de Intercorrências</h3>' + 
            listaIntercorrencias.map(i => `<p>Data: ${i.data}, Paciente: ${i.paciente}, Descrição: ${i.descricao}</p>`).join('');
    }

    function exportarParaPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("Boletins Diários", 10, 10);
        // Adicione aqui os dados que deseja incluir no PDF
        doc.save("boletins.pdf");
    }

    function exportarParaTXT() {
        const dadosBoletins = listaAtendimentos.map(item => `Data: ${item.data}, Paciente: ${item.paciente}, Queixa: ${item.queixa}`).join("\n");
        const blob = new Blob([dadosBoletins], { type: "text/plain;charset=utf-8" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "boletins.txt";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function exportarParaCSV() {
        const csvContent = "data:text/csv;charset=utf-8," + 
            listaAtendimentos.map(item => `${item.data},${item.paciente},${item.queixa}`).join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "boletins.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function exportarParaExcel() {
        const ws = XLSX.utils.json_to_sheet(listaAtendimentos);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Atendimentos");
        XLSX.writeFile(wb, "boletins.xlsx");
    }
</script>

</body>
</html>
