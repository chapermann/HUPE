<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletins</title>
    <link rel="stylesheet" href="styles.css"> <!-- Incluindo o CSS comum -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        /* Estilos específicos para o boletins.html */
        .module {
            max-width: 600px; /* Limitar a largura do módulo */
            margin: 20px auto; /* Centralizar o módulo na página */
            padding: 20px;
            background: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            text-align: center; /* Centralizar títulos */
        }

        button {
            width: 100%; /* Botão ocupa toda a largura */
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px; /* Margem superior para o botão */
        }

        button:hover {
            background-color: #218838; /* Efeito hover no botão */
        }

        #resultado {
            margin-top: 20px; /* Margem superior para o resultado */
            text-align: left; /* Alinhar texto à esquerda */
        }
    </style>
</head>
<body>

<h1>Boletins de Plantonistas e Atendimentos</h1>
<div class="module">
    <h2>Boletim de Plantonistas</h2>
    <button onclick="selecionarTipoPlantonista()">Produzir Boletim</button>

    <h2>Boletim de Atendimentos do Dia</h2>
    <button onclick="gerarBoletimAtendimentos()">Produzir Boletim</button>

    <h2>Boletim de Intercorrências</h2>
    <button onclick="gerarBoletimIntercorrencias()">Produzir Boletim</button>

    <button onclick="voltar()">Voltar</button> <!-- Botão Voltar -->
</div>

<div id="resultado"></div>

<script>
    // Função para obter dados de atendimentos do localStorage
    function obterDadosAtendimentos() {
        return JSON.parse(localStorage.getItem('atendimentos')) || [];
    }

    // Função para obter dados de plantonistas do localStorage
    function obterDadosPlantonistas() {
        return JSON.parse(localStorage.getItem('plantonistas')) || [];
    }

    function voltar() {
        window.location.href = 'index.html'; // Redireciona para index.html
    }

    function selecionarTipoPlantonista() {
        const tipo = prompt("Selecione o tipo de boletim:\n1. 12h\n2. 24h");
        if (tipo === "1") {
            gerarBoletimPlantonistas("12h");
        } else if (tipo === "2") {
            gerarBoletimPlantonistas("24h");
        } else {
            alert("Opção inválida! Por favor, escolha 1 ou 2.");
        }
    }

    function gerarBoletimPlantonistas(turno) {
        const plantonistas = obterDadosPlantonistas().filter(p => p.turno === turno);
        const formato = prompt("Escolha o formato de exibição:\n1. Tela\n2. PDF\n3. TXT\n4. CSV\n5. Excel");

        if (formato === "1") {
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = '<h3>Boletim de Plantonistas (' + turno + ')</h3>' + 
                plantonistas.map(p => `<p>${p.nome} - Turno: ${p.turno} - Dia: ${p.dia}</p>`).join('');
        } else {
            const { dia, mes, ano } = obterDataFormatada();
            const dados = plantonistas.map(p => ({ nome: p.nome, turno: p.turno, dia: p.dia }));

            switch (formato) {
                case "2":
                    exportarParaPDF(dados, `Boletim do Dia (${dia})/Mês (${mes})/Ano (${ano})`, 'Boletim de Plantonistas');
                    break;
                case "3":
                    exportarParaTXT(dados, `Boletim do Dia (${dia})/Mês (${mes})/Ano (${ano})`, 'Boletim de Plantonistas');
                    break;
                case "4":
                    exportarParaCSV(dados, `Boletim do Dia (${dia})/Mês (${mes})/Ano (${ano})`, 'Boletim de Plantonistas');
                    break;
                case "5":
                    exportarParaExcel(dados, `Boletim do Dia (${dia})/Mês (${mes})/Ano (${ano})`, 'Boletim de Plantonistas');
                    break;
                default:
                    alert("Formato inválido! Por favor, escolha uma opção válida.");
            }
        }
    }

    function gerarBoletimAtendimentos() {
        const atendimentos = obterDadosAtendimentos();
        const formato = prompt("Escolha o formato de exibição:\n1. Tela\n2. PDF\n3. TXT\n4. CSV\n5. Excel");

        if (formato === "1") {
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = '<h3>Boletim de Atendimentos do Dia</h3>' + 
                atendimentos.map(a => `<p>Data: ${a.data}, Paciente: ${a.paciente}, Queixa: ${a.queixa}</p>`).join('');
        } else {
            const { dia, mes, ano } = obterDataFormatada();
            const dados = atendimentos.map(a => ({ data: a.data, paciente: a.paciente, queixa: a.queixa }));

            switch (formato) {
                case "2":
                    exportarParaPDF(dados, `Boletim do Dia (${dia})/Mês (${mes})/Ano (${ano})`, 'Boletim de Atendimentos');
                    break;
                case "3":
                    exportarParaTXT(dados, `Boletim do Dia (${dia})/Mês (${mes})/Ano (${ano})`, 'Boletim de Atendimentos');
                    break;
                case "4":
                    exportarParaCSV(dados, `Boletim do Dia (${dia})/Mês (${mes})/Ano (${ano})`, 'Boletim de Atendimentos');
                    break;
                case "5":
                    exportarParaExcel(dados, `Boletim do Dia (${dia})/Mês (${mes})/Ano (${ano})`, 'Boletim de Atendimentos');
                    break;
                default:
                    alert("Formato inválido! Por favor, escolha uma opção válida.");
            }
        }
    }

    function gerarBoletimIntercorrencias() {
        const atendimentos = obterDadosAtendimentos().filter(a => a.tipo === 'intercorrencia');
        const formato = prompt("Escolha o formato de exibição:\n1. Tela\n2. PDF\n3. TXT\n4. CSV\n5. Excel");

        if (formato === "1") {
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = '<h3>Boletim de Intercorrências</h3>' + 
                atendimentos.map(i => `<p>Data: ${i.data}, Paciente: ${i.paciente}, Descrição: ${i.queixa}</p>`).join('');
        } else {
            const { dia, mes, ano } = obterDataFormatada();
            const dados = atendimentos.map(i => ({ data: i.data, paciente: i.paciente, queixa: i.queixa }));

            switch (formato) {
                case "2":
                    exportarParaPDF(dados, `Boletim do Dia (${dia})/Mês (${mes})/Ano (${ano})`, 'Boletim de Intercorrências');
                    break;
                case "3":
                    exportarParaTXT(dados, `Boletim do Dia (${dia})/Mês (${mes})/Ano (${ano})`, 'Boletim de Intercorrências');
                    break;
                case "4":
                    exportarParaCSV(dados, `Boletim do Dia (${dia})/Mês (${mes})/Ano (${ano})`, 'Boletim de Intercorrências');
                    break;
                case "5":
                    exportarParaExcel(dados, `Boletim do Dia (${dia})/Mês (${mes})/Ano (${ano})`, 'Boletim de Intercorrências');
                    break;
                default:
                    alert("Formato inválido! Por favor, escolha uma opção válida.");
            }
        }
    }

    function obterDataFormatada() {
        const dataAtual = new Date();
        const dia = String(dataAtual.getDate()).padStart(2, '0');
        const mes = String(dataAtual.getMonth() + 1).padStart(2, '0'); // Janeiro é 0
        const ano = dataAtual.getFullYear();
        return { dia, mes, ano, formatada: `${dia}_${mes}_${ano}` };
    }

    function exportarParaPDF(dados, cabecalho, tipo) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text(cabecalho, 10, 10, { bold: true });
        doc.text(`Tipo de boletim solicitado: ${tipo}`, 10, 20);
        doc.text("HUPE - UERJ", 10, 30);
        doc.text("Dados:", 10, 40);

        dados.forEach((item, index) => {
            doc.text(`Data: ${item.data || 'N/A'}, Paciente: ${item.paciente || 'N/A'}, Queixa: ${item.queixa || 'N/A'}`, 10, 50 + (index * 10));
        });

        doc.save(`Boletim_HUPE_${obterDataFormatada().formatada}.pdf`);
    }

    function exportarParaTXT(dados, cabecalho, tipo) {
        let dadosBoletins = `${cabecalho}\nTipo de boletim solicitado: ${tipo}\nHUPE - UERJ\n\n`;
        dadosBoletins += dados.map(item => `Data: ${item.data || 'N/A'}, Paciente: ${item.paciente || 'N/A'}, Queixa: ${item.queixa || 'N/A'}`).join("\n");
        
        const blob = new Blob([dadosBoletins], { type: "text/plain;charset=utf-8" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Boletim_HUPE_${obterDataFormatada().formatada}.txt`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function exportarParaCSV(dados, cabecalho, tipo) {
        let csvContent = `${cabecalho}\nTipo de boletim solicitado: ${tipo}\nHUPE - UERJ\n\n`;
        csvContent += "Data,Paciente,Queixa\n"; // Cabeçalho CSV

        csvContent += dados.map(item => `${item.data || 'N/A'},${item.paciente || 'N/A'},${item.queixa || 'N/A'}`).join("\n");
        
        const encodedUri = encodeURI("data:text/csv;charset=utf-8," + csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Boletim_HUPE_${obterDataFormatada().formatada}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function exportarParaExcel(dados, cabecalho, tipo) {
        const ws = XLSX.utils.json_to_sheet(dados);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Dados");
        XLSX.writeFile(wb, `Boletim_HUPE_${obterDataFormatada().formatada}.xlsx`);
    }
</script>

</body>
</html>
