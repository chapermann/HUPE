<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletins Diários</title>
    <link rel="stylesheet" href="styles.css"> <!-- Incluindo o CSS comum -->
</head>
<body>

<h1>Módulo de Boletins Diários</h1>
<div class="module">
    <label for="tipoBoletim">Selecione o tipo de boletim:</label>
    <select id="tipoBoletim">
        <option value="plantonistas">Boletim de Plantonistas</option>
        <option value="atendimentos">Boletim de Atendimentos</option>
        <option value="intercorrencias">Boletim de Intercorrências</option>
    </select>
    
    <button id="gerarBoletim">Gerar Boletim</button>
    <div id="resultadoBoletim"></div>
    <button onclick="location.href='index.html'">Voltar</button>
</div>

<script>
    document.getElementById('gerarBoletim').addEventListener('click', function() {
        const tipoBoletim = document.getElementById('tipoBoletim').value;
        const plantonistas = JSON.parse(localStorage.getItem('plantonistas')) || [];
        const atendimentos = JSON.parse(localStorage.getItem('atendimentos')) || [];
        let resultado = `Boletim Diário - ${tipoBoletim}:\n\n`;

        if (tipoBoletim === 'plantonistas') {
            resultado += 'Plantonistas:\n';
            if (plantonistas.length === 0) {
                resultado += 'Nenhum plantonista cadastrado.\n';
            } else {
                plantonistas.forEach(p => {
                    resultado += `${p.tipo}: ${p.nome}, Telefone: ${p.telefone}, Ano do Internato: ${p.anoInternato}, Dia: ${p.dia}, Turno: ${p.turno}\n`;
                });
            }
        } else if (tipoBoletim === 'atendimentos') {
            resultado += 'Atendimentos:\n';
            if (atendimentos.length === 0) {
                resultado += 'Nenhum atendimento solicitado.\n';
            } else {
                atendimentos.forEach(a => {
                    resultado += `${a.pacienteTipo}: ${a.nomePaciente}, Prontuário: ${a.prontuario}, Queixa: ${a.queixa}\n`;
                });
            }
        } else if (tipoBoletim === 'intercorrencias') {
            resultado += 'Intercorrências:\n';
            // Aqui você pode adicionar lógica para listar intercorrências se houver.
            resultado += 'Nenhuma intercorrência registrada.\n'; // Placeholder
        }

        document.getElementById('resultadoBoletim').innerText = resultado;
    });
</script>

</body>
</html>
