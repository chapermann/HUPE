<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletins</title>
    <link rel="stylesheet" href="styles.css"> <!-- Incluindo o CSS comum -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        /* Estilos específicos para o boletins.html */
        .module {
            max-width: 600px; /* Limitar a largura do módulo */
            margin: 20px auto; /* Centralizar o módulo na página */
            padding: 20px;
            background: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            text-align: center; /* Centralizar títulos */
        }

        button {
            width: 100%; /* Botão ocupa toda a largura */
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px; /* Margem superior para o botão */
        }

        button:hover {
            background-color: #218838; /* Efeito hover no botão */
        }

        #resultado {
            margin-top: 20px; /* Margem superior para o resultado */
            text-align: left; /* Alinhar texto à esquerda */
        }
    </style>
</head>
<body>

<h1>Boletins de Plantonistas e Atendimentos</h1>
<div class="module">
    <h2>Selecionar Tipo de Boletim</h2>
    <select id="tipoBoletim" onchange="atualizarBoletim()">
        <option value="12h">Boletim de 12h</option>
        <option value="24h">Boletim de 24h</option>
    </select>

    <h2>Ver Dados</h2>
    <button onclick="verBoletimPlantonistas()">Boletim de Plantonistas</button>
    <button onclick="verBoletimAtendimentos()">Boletim de Atendimentos do Dia</button>
    <button onclick="verBoletimIntercorrencias()">Boletim de Intercorrências</button>

    <h2>Exportar Dados</h2>
    <button onclick="exportarParaPDF()">Exportar como PDF</button>
    <button onclick="exportarParaTXT()">Exportar como TXT</button>
    <button onclick="exportarParaCSV()">Exportar como CSV</button>
    <button onclick="exportarParaExcel()">Exportar como Excel</button>
    
    <button onclick="voltar()">Voltar</button> <!-- Botão Voltar -->
</div>

<div id="resultado"></div>

<script>
    // Função para obter dados de atendimentos do localStorage
    function obterDadosAtendimentos() {
        return JSON.parse(localStorage.getItem('atendimentos')) || [];
    }

    // Função para obter dados de plantonistas do localStorage
    function obterDadosPlantonistas() {
        return JSON.parse(localStorage.getItem('plantonistas')) || [];
    }

    function voltar() {
        window.location.href = 'index.html'; // Redireciona para index.html
    }

    function atualizarBoletim() {
        const tipo = document.getElementById('tipoBoletim').value;
        verBoletimPlantonistas(tipo);
    }

    function verBoletimPlantonistas(tipo) {
        const plantonistas = obterDadosPlantonistas();
        const resultadoDiv = document.getElementById('resultado');
        resultadoDiv.innerHTML = '<h3>Boletim de Plantonistas (' + tipo + ')</h3>' + 
            plantonistas.filter(p => p.turno === tipo).map(p => `<p>${p.nome} - Turno: ${p.turno} - Dia: ${p.dia}</p>`).join('');
    }

    function verBoletimAtendimentos() {
        const atendimentos = obterDadosAtendimentos();
        const resultadoDiv = document.getElementById('resultado');
        resultadoDiv.innerHTML = '<h3>Boletim de Atendimentos do Dia</h3>' + 
            atendimentos.map(a => `<p>Data: ${a.data}, Paciente: ${a.paciente}, Queixa: ${a.queixa}</p>`).join('');
    }

    function verBoletimIntercorrencias() {
        const atendimentos = obterDadosAtendimentos();
        const intercorrencias = atendimentos.filter(a => a.tipo === 'intercorrencia');
        const resultadoDiv = document.getElementById('resultado');
        resultadoDiv.innerHTML = '<h3>Boletim de Intercorrências</h3>' + 
            intercorrencias.map(i => `<p>Data: ${i.data}, Paciente: ${i.paciente}, Descrição: ${i.queixa}</p>`).join('');
    }

    function obterDataFormatada() {
        const dataAtual = new Date();
        const dia = String(dataAtual.getDate()).padStart(2, '0');
        const mes = String(dataAtual.getMonth() + 1).padStart(2, '0'); // Janeiro é 0
        const ano = dataAtual.getFullYear();
        return { dia, mes, ano, formatada: `${dia}_${mes}_${ano}` };
    }

    function exportarParaPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const { dia, mes, ano } = obterDataFormatada();
        const tipo = document.getElementById('tipoBoletim').value;

        doc.text(`Boletim do Dia (${dia})/Mês (${mes})/Ano (${ano})`, 10, 10, { bold: true });
        doc.text(`Tipo de boletim solicitado: ${tipo}`, 10, 20);
        doc.text("HUPE - UERJ", 10, 30);
        doc.text("Dados dos atendimentos:", 10, 40);

        const atendimentos = obterDadosAtendimentos();
        atendimentos.forEach((a, index) => {
            if (a.data && a.paciente && a.queixa) { // Verifica se os dados estão definidos
                doc.text(`Data: ${a.data}, Paciente: ${a.paciente}, Queixa: ${a.queixa}`, 10, 50 + (index * 10));
            }
        });

        doc.save(`Boletim_HUPE_${obterDataFormatada().formatada}.pdf`);
    }

    function exportarParaTXT() {
        const atendimentos = obterDadosAtendimentos();
        const { dia, mes, ano } = obterDataFormatada();
        let dadosBoletins = `Boletim do Dia (${dia})/Mês (${mes})/Ano (${ano})\nTipo de boletim solicitado: ${document.getElementById('tipoBoletim').value}\nHUPE - UERJ\n\n`;

        dadosBoletins += atendimentos.map(item => {
            if (item.data && item.paciente && item.queixa) { // Verifica se os dados estão definidos
                return `Data: ${item.data}, Paciente: ${item.paciente}, Queixa: ${item.queixa}`;
            }
            return ''; // Retorna uma string vazia se os dados não estiverem definidos
        }).join("\n");
        
        const blob = new Blob([dadosBoletins], { type: "text/plain;charset=utf-8" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Boletim_HUPE_${obterDataFormatada().formatada}.txt`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function exportarParaCSV() {
        const atendimentos = obterDadosAtendimentos();
        const { dia, mes, ano } = obterDataFormatada();
        let csvContent = `Boletim do Dia (${dia})/Mês (${mes})/Ano (${ano})\nTipo de boletim solicitado: ${document.getElementById('tipoBoletim').value}\nHUPE - UERJ\n\n`;
        csvContent += "Data,Paciente,Queixa\n"; // Cabeçalho CSV

        csvContent += atendimentos.map(item => {
            if (item.data && item.paciente && item.queixa) { // Verifica se os dados estão definidos
                return `${item.data},${item.paciente},${item.queixa}`;
            }
            return ''; // Retorna uma string vazia se os dados não estiverem definidos
        }).join("\n");
        
        const encodedUri = encodeURI("data:text/csv;charset=utf-8," + csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Boletim_HUPE_${obterDataFormatada().formatada}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function exportarParaExcel() {
        const atendimentos = obterDadosAtendimentos();
        const { dia, mes, ano } = obterDataFormatada();
        const ws = XLSX.utils.json_to_sheet(atendimentos.filter(item => item.data && item.paciente && item.queixa)); // Filtra dados válidos
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Atendimentos");
        XLSX.writeFile(wb, `Boletim_HUPE_${obterDataFormatada().formatada}.xlsx`);
    }
</script>

</body>
</html>
