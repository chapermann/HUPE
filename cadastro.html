<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Plantonista</title>
    <link rel="stylesheet" href="styles.css"> <!-- Incluindo o CSS comum -->
    <style>
        /* Estilos específicos para o cadastro.html */
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa; /* Cor de fundo */
        }

        .module {
            max-width: 600px; /* Limitar a largura do módulo */
            margin: 20px auto; /* Centralizar o módulo na página */
            padding: 20px;
            background: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            text-align: center; /* Centralizar títulos */
        }

        label {
            display: block; /* Colocar cada label em uma nova linha */
            margin: 10px 0 5px; /* Margem ao redor dos labels */
        }

        input[type="text"], select {
            width: 100%; /* Campo ocupa toda a largura */
            padding: 10px;
            margin-bottom: 15px; /* Margem inferior para espaçamento */
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px; /* Aumentar o tamanho da fonte */
        }

        button {
            width: 100%; /* Botão ocupa toda a largura */
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px; /* Aumentar o tamanho da fonte */
        }

        button:hover {
            background-color: #218838; /* Efeito hover no botão */
        }

        .spacer {
            margin-top: 20px; /* Espaço adicional para o botão Voltar */
        }
    </style>
</head>
<body>

<div class="module">
    <h1>Cadastro de Plantonista</h1>
    <form id="formCadastro">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required>

        <label for="categoria">Categoria:</label>
        <select id="categoria" required>
            <option value="">Selecione</option>
            <option value="interno_5">Interno 5º ano</option>
            <option value="interno_6">Interno 6º ano</option>
            <option value="staff">Staff</option>
            <option value="residente">Residente</option>
        </select>

        <label for="telefone">Telefone (DD-XXXXX-XXXX):</label>
        <input type="text" id="telefone" pattern="\d{2}-\d{5}-\d{4}" placeholder="21-98765-4321" required>

        <label for="turno">Turno de Plantão:</label>
        <select id="turno" required>
            <option value="">Selecione</option>
            <option value="12h">12h</option>
            <option value="24h">24h</option>
        </select>

        <label for="dia">Dia do Plantão:</label>
        <select id="dia" required>
            <option value="">Selecione</option>
            <option value="segunda">Segunda-feira</option>
            <option value="terca">Terça-feira</option>
            <option value="quarta">Quarta-feira</option>
            <option value="quinta">Quinta-feira</option>
            <option value="sexta">Sexta-feira</option>
            <option value="sabado">Sábado</option>
            <option value="domingo">Domingo</option>
        </select>

        <button type="submit">Cadastrar</button>
    </form>

    <div class="spacer"></div>
    <button onclick="voltar()">Voltar ao Index</button> <!-- Botão Voltar -->
</div>

<script>
    function voltar() {
        window.location.href = 'index.html'; // Redireciona para index.html
    }

    document.getElementById('formCadastro').addEventListener('submit', function(event) {
        event.preventDefault();
        // Aqui você pode adicionar a lógica para processar o cadastro
        alert('Plantonista cadastrado com sucesso!'); // Placeholder para ação de sucesso
        this.reset(); // Limpa o formulário após o envio
    });
</script>

</body>
</html>
