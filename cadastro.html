<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="styles.css"> <!-- Incluindo o CSS comum -->
    <style>
        /* Estilos específicos para o cadastro.html */
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa; /* Cor de fundo */
        }

        .module {
            max-width: 600px; /* Limitar a largura do módulo */
            margin: 20px auto; /* Centralizar o módulo na página */
            padding: 20px;
            background: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            text-align: center; /* Centralizar títulos */
        }

        label {
            display: block; /* Colocar cada label em uma nova linha */
            margin: 10px 0 5px; /* Margem ao redor dos labels */
        }

        input[type="text"], input[type="date"], input[type="number"], select {
            width: 100%; /* Campo ocupa toda a largura */
            padding: 10px;
            margin-bottom: 15px; /* Margem inferior para espaçamento */
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px; /* Aumentar o tamanho da fonte */
        }

        button {
            width: 100%; /* Botão ocupa toda a largura */
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px; /* Aumentar o tamanho da fonte */
        }

        button:hover {
            background-color: #218838; /* Efeito hover no botão */
        }

        .spacer {
            margin-top: 20px; /* Espaço adicional para o botão Voltar */
        }
    </style>
</head>
<body>

<div class="module">
    <h1>Cadastro de Paciente</h1>
    <form id="formCadastro">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required>

        <label for="dataNascimento">Data de Nascimento:</label>
        <input type="date" id="dataNascimento" required>

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" required>

        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone" required>

        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" required>

        <label for="genero">Gênero:</label>
        <select id="genero" required>
            <option value="">Selecione</option>
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
            <option value="outro">Outro</option>
        </select>

        <button type="submit">Cadastrar</button>
    </form>

    <div class="spacer"></div>
    <button onclick="voltar()">Voltar ao Index</button> <!-- Botão Voltar -->
</div>

<script>
    function voltar() {
        window.location.href = 'index.html'; // Redireciona para index.html
    }

    document.getElementById('formCadastro').addEventListener('submit', function(event) {
        event.preventDefault();
        // Aqui você pode adicionar a lógica para processar o cadastro
        alert('Paciente cadastrado com sucesso!'); // Placeholder para ação de sucesso
        this.reset(); // Limpa o formulário após o envio
    });
</script>

</body>
</html>
