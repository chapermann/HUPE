<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro dos Plantonistas</title>
    <link rel="stylesheet" href="styles.css"> <!-- Incluindo o CSS comum -->
</head>
<body>

<h1>Módulo de Cadastro dos Plantonistas</h1>
<div class="module">
    <form id="cadastroForm">
        <label for="tipo">Tipo de Plantonista:</label>
        <select id="tipo" required>
            <option value="interno_5">Interno 5o Ano</option>
            <option value="interno_6">Interno 6o Ano</option>
            <option value="residente">Residente</option>
            <option value="staff">Staff</option>
        </select>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" required>

        <label for="telefone">Telefone (DD-XXXX-XXXXX):</label>
        <input type="text" id="telefone" pattern="^\d{2}-\d{4}-\d{5}$" placeholder="Ex: 11-9876-54321" required>

        <label for="dia">Dia de Plantão:</label>
        <select id="dia" required>
            <option value="segunda">Segunda-feira</option>
            <option value="terca">Terça-feira</option>
            <option value="quarta">Quarta-feira</option>
            <option value="quinta">Quinta-feira</option>
            <option value="sexta">Sexta-feira</option>
            <option value="sabado">Sábado</option>
            <option value="domingo">Domingo</option>
        </select>

        <label for="turno">Turno:</label>
        <select id="turno" required>
            <option value="12h">12h</option>
            <option value="24h">24h</option>
        </select>

        <button type="submit">Cadastrar Plantonista</button>
    </form>
    <button onclick="location.href='index.html'">Voltar</button>

    <h2>Plantonistas Cadastrados:</h2>
    <div id="listaPlantonistas"></div>
</div>

<script>
    function atualizarLista() {
        const lista = JSON.parse(localStorage.getItem('plantonistas')) || [];
        const listaDiv = document.getElementById('listaPlantonistas');
        listaDiv.innerHTML = lista.map(p => `<p>${p.tipo}: ${p.nome}, Telefone: ${p.telefone}, Dia: ${p.dia}, Turno: ${p.turno}</p>`).join('');
    }

    window.onload = function() {
        atualizarLista();
    };

    document.getElementById('cadastroForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const tipo = document.getElementById('tipo').value;
        const nome = document.getElementById('nome').value;
        const telefone = document.getElementById('telefone').value;
        const dia = document.getElementById('dia').value;
        const turno = document.getElementById('turno').value;

        const plantonista = { tipo, nome, telefone, dia, turno };
        const lista = JSON.parse(localStorage.getItem('plantonistas')) || [];
        lista.push(plantonista);
        localStorage.setItem('plantonistas', JSON.stringify(lista));

        atualizarLista();
        document.getElementById('cadastroForm').reset();
    });
</script>

</body>
</html>
