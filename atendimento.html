<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Atendimento Médico</title>
    <link rel="stylesheet" href="styles.css"> <!-- Incluindo o CSS comum -->
    <style>
        /* Estilos específicos para o atendimento.html */
        .module {
            max-width: 600px; /* Limitar a largura do módulo */
            margin: 20px auto; /* Centralizar o módulo na página */
            padding: 20px;
            background: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin: 15px 0 5px; /* Margem superior aumentada para espaçamento */
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px; /* Espaçamento inferior aumentado */
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%; /* Botão ocupa toda a largura */
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px; /* Margem superior para o botão */
        }

        button:hover {
            background-color: #218838; /* Efeito hover no botão */
        }
    </style>
</head>
<body>

<h1>Módulo de Solicitação de Atendimento Médico</h1>
<div class="module">
    <form id="atendimentoForm">
        <label for="pacienteTipo">Tipo de Paciente:</label>
        <select id="pacienteTipo" required>
            <option value="externo">Paciente Externo (triagem)</option>
            <option value="interno">Paciente Interno</option>
            <option value="intercorrencia">Intercorrência</option>
        </select>

        <label for="nomePaciente">Nome do Paciente:</label>
        <input type="text" id="nomePaciente" required>

        <label for="prontuario">Prontuário:</label>
        <input type="text" id="prontuario" required>

        <label for="queixa">Queixa ou Demanda:</label>
        <textarea id="queixa" maxlength="250" required></textarea>

        <label for="responsavel">Responsável pelo Atendimento:</label>
        <input type="text" id="responsavel" required>

        <button type="submit">Solicitar Atendimento</button>
    </form>
    <button onclick="location.href='index.html'">Voltar</button>
</div>

<script>
    document.getElementById('atendimentoForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const pacienteTipo = document.getElementById('pacienteTipo').value;
        const nomePaciente = document.getElementById('nomePaciente').value;
        const prontuario = document.getElementById('prontuario').value;
        const queixa = document.getElementById('queixa').value;
        const responsavel = document.getElementById('responsavel').value;

        const atendimento = { pacienteTipo, nomePaciente, prontuario, queixa, responsavel };
        const lista = JSON.parse(localStorage.getItem('atendimentos')) || [];
        lista.push(atendimento);
        localStorage.setItem('atendimentos', JSON.stringify(lista));

        alert("Atendimento solicitado com sucesso!"); // Mensagem de confirmação
        document.getElementById('atendimentoForm').reset();
    });
</script>

</body>
</html>
